<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
                <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <div class="container d-flex justify-content-center align-items-center" style="height: 100vh;">
    <div class="login-class  p-4">
       <div class="text-center mb-4">
        <img src="logo.jpg" width="170">
       </div>

       <div class="login-tabs mb-3 p-1">
        <button class="btn active-tab p-1">Student Login</button> 
        <button class="btn ">Teacher Login</button>
       </div>

         <form>
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control form-control-lg" id="email" placeholder="Enter your email">
          </div>
          <div class="mb-3 position-relative">
            <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control form-control-lg" id="password" placeholder="Enter your password">
                <i class="bi bi-eye password-toggle" id="togglePassword" style="position: absolute; top: 50%; right: 15px; transform: translateY(-50%); cursor: pointer;"></i>
          </div>
          <div class="text-center mb-3">
            

                <p class="text-center mt-4">Forgot Password?<a href="#" class="text-decoration-none">Click Here!</a></p>
                 <button type="submit"
                 class="btn btn-primary px-5 py-2">
                  Login
            </button>
          </div>

          <p class="text-center mt-4">Don't have an account? <a href="#" class="text-decoration-none">Register</a></p>
          
          <p class="text-center mt-4">Or sign in with</p>

          <div class="text-center">
            <a href="#" class="btn "><i class="bi bi-google google-icon"></i></a>
          </div>
        </form>
      </div>
    </div>
</body>
</html>
